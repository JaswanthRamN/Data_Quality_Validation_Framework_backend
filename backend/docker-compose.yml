version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: data_quality_postgres
    environment:
      POSTGRES_USER: data_quality_user
      POSTGRES_PASSWORD: secure_password_change_this
      POSTGRES_DB: data_quality_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_quality_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_quality_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: data_quality_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_quality_network
    command: redis-server --appendonly yes

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_quality_api
    environment:
      DATABASE_URL: postgresql://data_quality_user:secure_password_change_this@postgres:5432/data_quality_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: your-super-secret-key-change-this-in-production-make-it-long-and-random
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DEBUG: "False"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./data_sources:/app/data_sources
    networks:
      - data_quality_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  data_quality_network:
    driver: bridge
